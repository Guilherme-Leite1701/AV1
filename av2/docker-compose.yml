# PostgreSQL 16 — npm run db:up / npm run db:down
services:
  postgres:
    image: postgres:16-alpine
    container_name: greencode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode
      POSTGRES_DB: greencode
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - greencode-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  greencode-dados:
